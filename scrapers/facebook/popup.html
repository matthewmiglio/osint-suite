<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, Segoe UI, sans-serif; width: 260px; padding: 14px; margin: 0; }
    h3 { margin: 0 0 10px 0; font-size: 14px; }
    label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 13px; }
    button { width: 100%; margin-top: 10px; padding: 8px; font-size: 13px; cursor: pointer; }
    #status { margin-top: 12px; font-size: 13px; font-weight: 600; color: #333; min-height: 18px; }
    .ok { color: #0a7d28; }
    .err { color: #b00020; }
    .muted { color: #666; font-weight: normal; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
  </style>
</head>
<body>
  <h3>FB Post Scraper</h3>
  <label>Folder name (under Downloads)</label>
  <input id="folder" type="text" value="fb-scrape" />
  <label>Max photos to walk (0 = unlimited)</label>
  <input id="maxPhotos" type="number" value="50" min="0" />
  <label>Delay between photos (ms)</label>
  <input id="delay" type="number" value="1500" min="300" />
  <div class="row">
    <button id="start">Start scraping</button>
    <button id="stop">Stop</button>
  </div>
  <button id="single">Scrape current photo only</button>
  <div id="status" class="muted">Open a photo viewer on facebook.com first.</div>
  <script src="popup.js"></script>
</body>
</html>
