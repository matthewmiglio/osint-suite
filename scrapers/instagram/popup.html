<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 360px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #e1306c;
    }
    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin: 8px 0 4px 0;
    }
    input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #0d0d1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #eee;
      font-size: 14px;
      font-family: inherit;
    }
    textarea { min-height: 80px; resize: vertical; }
    .hint { font-size: 11px; color: #888; margin-top: 4px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .row label { margin: 0; color: #ccc; font-size: 12px; }
    button {
      width: 100%;
      padding: 10px;
      margin: 6px 0 0 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    #startBtn { background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color: #fff; }
    #startBtn:disabled { background: #555; cursor: not-allowed; }
    #stopBtn { background: #dc3545; color: white; display: none; }
    #copyLogBtn { background: #6c757d; color: white; font-size: 11px; padding: 5px; margin-top: 6px; }

    #statsBar {
      margin-top: 10px;
      padding: 8px 10px;
      background: #2a2a4a;
      border-radius: 6px;
      font-size: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .stat-label { color: #888; }
    .stat-value { font-weight: 600; }
    #statPhase { color: #00a8e8; }
    #statFollowers { color: #28a745; }
    #statFollowing { color: #ffc107; }
    #statElapsed { color: #e1306c; }

    #terminal {
      margin-top: 10px;
      padding: 10px;
      background: #0d0d1a;
      border: 1px solid #333;
      border-radius: 6px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      min-height: 120px;
      max-height: 250px;
      overflow-y: auto;
      line-height: 1.4;
      color: #ccc;
    }
    #terminal .log-line { margin: 0; }
    #terminal .log-err { color: #dc3545; }
    #terminal .log-info { color: #ffc107; }
  </style>
</head>
<body>
  <h2>IG Circle Scraper</h2>

  <label for="handleInput">Instagram username(s) — one per line for batch</label>
  <textarea id="handleInput" placeholder="toxiins_st&#10;jdmxtra&#10;benmccormack77" autocomplete="off"></textarea>
  <div class="hint">Private profiles will be detected on the landing page and skipped automatically.</div>

  <div class="row">
    <input type="checkbox" id="downloadPics" checked />
    <label for="downloadPics">Also download profile pictures</label>
  </div>

  <button id="startBtn">Start Scraping</button>
  <button id="stopBtn">Stop</button>

  <div id="statsBar">
    <div><span class="stat-label">Queue: </span><span class="stat-value" id="statQueue">-</span></div>
    <div><span class="stat-label">Elapsed: </span><span class="stat-value" id="statElapsed">0:00:00</span></div>
    <div><span class="stat-label">Phase: </span><span class="stat-value" id="statPhase">idle</span></div>
    <div><span class="stat-label">Current: </span><span class="stat-value" id="statHandle">-</span></div>
    <div><span class="stat-label">Followers: </span><span class="stat-value" id="statFollowers">0</span></div>
    <div><span class="stat-label">Following: </span><span class="stat-value" id="statFollowing">0</span></div>
  </div>

  <div id="terminal">
    <p class="log-line log-info">Enter an IG handle and click "Start Scraping".</p>
  </div>
  <button id="copyLogBtn">Copy Log</button>

  <script src="popup.js"></script>
</body>
</html>
